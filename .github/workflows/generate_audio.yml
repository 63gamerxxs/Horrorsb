name: Generate Dialogue Audio
on:
  workflow_dispatch:
    inputs:
      dialogue:
        description: 'Dialogue to generate'
        required: true
        default: 'Is anyone there?'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install requests
      - name: Generate Audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python scripts/generate_dialogue.py "${{ github.event.inputs.dialogue }}" output.mp3
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dialogue-audio
          path: output.mp3
